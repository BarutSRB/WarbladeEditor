[package]
name = "warblade-lobby"
version = "0.1.0"
edition = "2021"
description = "Warblade Remake lobby server: identity, lobby list, global chat, talents, NAT rendezvous, owner stats"
publish = false

[[bin]]
name = "warblade-lobby"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
